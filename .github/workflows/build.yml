name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Cross-compile for Windows from Linux, exactly as a developer does with
  # podman: build-container.sh builds the toolkit image from
  # tools/Containerfile.toolkit -- llvm-mingw, and for each target zlib, xz,
  # zstd, bzip2 and Qt compiled from Fedora's source RPMs -- and runs the
  # build in it; deploy-container.sh packages it there. One image holds both
  # targets, so one job builds it once and then both; the targets differ
  # only in the architecture named. The runner itself only needs podman,
  # which ubuntu-latest has.
  #
  # Release files and artifacts are named win-x64 and win-arm64, as Windows
  # names the two (Settings, System, About) and as .NET and Node.js name
  # their Windows builds.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    # GITHUB_TOKEN: the run's own token, for the GitHub API lookup of
    # llvm-mingw's newest release, which anonymously is limited to 60
    # requests an hour. container_run passes it into the image build as a
    # secret, so it is not stored in the image.
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      # The first build builds the image (fresh on every run, nearly all of
      # it Qt, once per target), then the exe; each fails if it is not a
      # Windows binary for its architecture.
      - name: Build win-x64
        run: bash tools/build-container.sh x64

      - name: Package win-x64
        run: bash tools/deploy-container.sh x64

      # The image was built minutes ago, by the step above: no update check.
      - name: Build win-arm64
        env:
          W32DI_REFRESH: "0"
        run: bash tools/build-container.sh arm64

      - name: Package win-arm64
        run: bash tools/deploy-container.sh arm64

      - uses: actions/upload-artifact@v7
        with:
          name: WinDiskImager-win-x64
          path: dist-x64/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: WinDiskImager-win-arm64
          path: dist-arm64/
          if-no-files-found: error

  # One release for both builds, made only once the build job has produced
  # both, so a tag never publishes one architecture without the other.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Needed to create the GitHub release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # A tag that disagrees with src/CMakeLists.txt would ship a binary whose
      # own version string contradicts the release it is attached to.
      - name: Check the tag matches the project version
        run: |
          version=$(sed -n 's/^project(WinDiskImager VERSION \([0-9.]*\).*/\1/p' src/CMakeLists.txt)
          echo "project version: $version, tag: ${GITHUB_REF_NAME}"
          test "v$version" = "${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v8
        with:
          name: WinDiskImager-win-x64
          path: WinDiskImager-${{ github.ref_name }}-win-x64

      - uses: actions/download-artifact@v8
        with:
          name: WinDiskImager-win-arm64
          path: WinDiskImager-${{ github.ref_name }}-win-arm64

      - name: Build the release zips
        run: |
          for arch in win-x64 win-arm64; do
            name="WinDiskImager-${GITHUB_REF_NAME}-$arch"
            zip -qr "$name.zip" "$name"
            sha256sum "$name.zip" > "$name.zip.sha256"
            cat "$name.zip.sha256"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="WinDiskImager-${GITHUB_REF_NAME}"
          cat > notes.md <<'EOF'
          Standalone builds for Windows:

          - `win-x64`: most Windows PCs (Intel and AMD).
          - `win-arm64`: Windows on ARM (Snapdragon and other ARM64 devices).

          Settings > System > About shows which one a PC has: an
          "x64-based processor" or an "ARM-based processor".

          Unzip the one for your machine and run `WinDiskImager.exe` as Administrator.

          Verify the download against the published `.sha256` before running it.

          See `Changelog.txt` in the zip for what changed.
          EOF
          # --repo makes gh resolve the target over the API rather than by
          # inspecting the local git remote.
          gh release create "${GITHUB_REF_NAME}" \
            "$base-win-x64.zip" "$base-win-x64.zip.sha256" \
            "$base-win-arm64.zip" "$base-win-arm64.zip.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
