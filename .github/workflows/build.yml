name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Cross-compile a win64 binary from Linux, exactly as a developer does with
  # podman: the two scripts below build the Fedora image from
  # tools/Containerfile.build (Ubuntu has no MinGW Qt6 packages; Fedora does)
  # and run the build and the packaging inside it. The runner itself only
  # needs podman, zip and gh, which ubuntu-latest has.
  windows-x86_64:
    runs-on: ubuntu-latest
    # Needed only by the release step, which creates a GitHub release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Builds the image on first use, then the exe; fails if it is not win64 PE.
      - name: Build
        run: bash tools/build-container.sh

      - name: Package
        run: bash tools/deploy-container.sh

      - uses: actions/upload-artifact@v7
        with:
          name: WinDiskImager-win64
          path: dist/
          if-no-files-found: error

      # A tag that disagrees with src/CMakeLists.txt would ship a binary whose
      # own version string contradicts the release it is attached to.
      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^project(WinDiskImager VERSION \([0-9.]*\).*/\1/p' src/CMakeLists.txt)
          echo "project version: $version, tag: ${GITHUB_REF_NAME}"
          test "v$version" = "${GITHUB_REF_NAME}"

      - name: Build the release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="WinDiskImager-${GITHUB_REF_NAME}-win64"
          mv dist "$name"
          zip -qr "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"
          cat "$name.zip.sha256"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="WinDiskImager-${GITHUB_REF_NAME}-win64"
          cat > notes.md <<'EOF'
          Standalone win64 build.
          Unzip and run `WinDiskImager.exe` as Administrator.

          Verify the download against the published `.sha256` before running it.

          See `Changelog.txt` in the zip for what changed.
          EOF
          # --repo makes gh resolve the target over the API rather than by
          # inspecting the local git remote.
          gh release create "${GITHUB_REF_NAME}" \
            "$name.zip" "$name.zip.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
